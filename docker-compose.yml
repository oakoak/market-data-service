# Local prototype stack: redis (broker) + clickhouse (storage) + collector + normalizer + api.
#
# Deliberately cut down per docs/03-mvp-scope.md: single exchange/segment
# (Binance spot). See docs/07-local-dev.md.
#
# Phase A (2026-09, docs/08-prototype-roadmap.md): multi-symbol spot. ONE
# `collector` container now multiplexes every symbol in `SYMBOLS` over one
# combined WS connection (src/collector/config.py, src/exchanges/binance/spot.py).
# `normalizer`, by contrast, is still architecturally one-symbol-per-process
# (its order-book state and incident tracking are scoped per symbol,
# src/normalizer/consumer.py `NormalizerContext`) -- so instead of one
# normalizer container, this file runs one named `normalizer-<symbol>`
# service per spot symbol, each with its own `SYMBOL`/`CONSUMER_GROUP`,
# all reading from the streams the single multi-symbol collector publishes.
# Default symbol list matches docs/04-architecture/exchanges/binance.md's
# spot instrument list (8 symbols); override with `SYMBOLS=...` in `.env` to
# collect a subset -- but note the 8 `normalizer-*` services below are still
# static per-symbol blocks (Compose has no clean way to spin up N replicas
# with N different SYMBOL values), so removing a symbol from `SYMBOLS`
# without removing its matching `normalizer-*` block just leaves that
# consumer idle on an empty stream, and *adding* a 9th symbol needs a new
# `normalizer-*` block added here by hand -- flagged as a known rough edge,
# not solved in this pass (see docs/08-prototype-roadmap.md Phase A).
#
# USDT-M perp (`SEGMENT=usdtm`) is unaffected by this and stays exactly as
# before: single-symbol-per-process, still requires manually pointing this
# same `collector`/`normalizer-btcusdt`-shaped pair at `SEGMENT=usdtm` with
# a single `SYMBOLS=<one symbol>` (collector/main.py raises if usdtm gets
# more than one symbol) -- running spot's 8-way multi-symbol setup
# concurrently with a usdtm slice still means duplicating the stack, exactly
# as already noted below in .env.example (not solved here, out of Phase A
# scope per docs/08-prototype-roadmap.md's phase ordering).
#
# Cross-platform note (Windows Docker Desktop + Linux dev, same compose file):
# stateful data (Redis, ClickHouse) lives in named volumes, not host bind-mounts,
# to avoid Windows path/permission issues. Only source code / migration directories
# are bind-mounted, using relative `./...` paths that Compose resolves the same way
# on both platforms.
#
# Logging & monitoring (loki/grafana/prometheus/cadvisor): app/infra services ship
# their stdout logs to Loki via the `loki` Docker logging driver -- a one-time host
# setup step, see docs/07-local-dev.md. The driver runs at the Docker daemon level
# (not inside a container's own network namespace), so `loki-url` targets Loki's
# *published host port* over `localhost`, which resolves correctly whether the
# daemon is native Linux or the Docker Desktop VM (both cases the daemon owns the
# port it just published). Requires: `docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions`.
#
# Single entry point (traefik): the human-facing web UIs (api docs, grafana,
# prometheus, cadvisor) are only reachable through Traefik on one published port
# (${TRAEFIK_HOST_PORT:-80}), routed by Host header (`api.localhost`,
# `grafana.localhost`, ...) -- browsers resolve *.localhost to 127.0.0.1 without
# any /etc/hosts edits. Those 4 services no longer publish their own host ports;
# they're still reachable container-to-container by name on market-data-net for
# anything (e.g. prometheus -> cadvisor) that doesn't go through the proxy.
# Data-plane services (redis, clickhouse, loki's push endpoint) keep their direct
# ports since they're not meant to go through a human-facing reverse proxy.
# Chosen over a bare Docker Compose port-per-service setup specifically because
# Traefik auto-discovers routing from container labels (see `traefik.*` labels
# below) -- add a service, add its labels, no central proxy config file to
# hand-edit. This is also where a future unified-auth layer plugs in cleanly:
# a single `traefik.http.middlewares.<name>.forwardauth.*` label added to each
# of these 4 services' label blocks, no per-app auth code.

networks:
  market-data-net:
    name: market-data-net
    driver: bridge

volumes:
  redis-data:
  clickhouse-data:
  loki-data:
  prometheus-data:
  grafana-data:

x-loki-log-options: &loki-log-options
  loki-url: "http://localhost:${LOKI_HOST_PORT:-3100}/loki/api/v1/push"
  loki-retries: "3"
  loki-batch-size: "400"

services:
  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - market-data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=redis,project=market-data"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.6.70-alpine
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Numeric filename prefixes (001_/002_/003_/004_) guarantee execution order.
      # Mount the whole migrations/ dir as the image's init.d hook (read-only).
      - ./infra/clickhouse/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - market-data-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=clickhouse,project=market-data"

  collector:
    build:
      context: .
      dockerfile: ./src/collector/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_STREAM_DB: ${REDIS_STREAM_DB:-1}
      EXCHANGE: ${EXCHANGE:-binance}
      SEGMENT: ${SEGMENT:-spot}
      SYMBOLS: ${SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,BNBUSDT,DOGEUSDT,BTCFDUSD,ETHFDUSD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-1000000}
      BACKOFF_INITIAL_S: ${BACKOFF_INITIAL_S:-1}
      BACKOFF_MAX_S: ${BACKOFF_MAX_S:-60}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - market-data-net
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=collector,project=market-data"

  # Shared shape for every per-symbol normalizer below -- only `SYMBOL`
  # differs between them (see header comment: one normalizer process per
  # symbol, matching NormalizerContext's per-symbol order-book/incident
  # state). `CONSUMER_GROUP` is left unset here so each falls back to
  # normalizer/config.py's default (`normalizer:{exchange}:{segment}:{symbol}`),
  # which is already unique per symbol -- no override needed.
  normalizer-btcusdt: &normalizer-base
    build:
      context: .
      dockerfile: ./src/normalizer/Dockerfile
    restart: unless-stopped
    environment: &normalizer-base-env
      REDIS_URL: redis://redis:6379
      REDIS_STREAM_DB: ${REDIS_STREAM_DB:-1}
      EXCHANGE: ${EXCHANGE:-binance}
      SEGMENT: ${SEGMENT:-spot}
      SYMBOL: BTCUSDT
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-market_data}
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - market-data-net
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=normalizer,project=market-data,symbol=btcusdt"

  normalizer-ethusdt:
    <<: *normalizer-base
    environment:
      <<: *normalizer-base-env
      SYMBOL: ETHUSDT
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=normalizer,project=market-data,symbol=ethusdt"

  normalizer-solusdt:
    <<: *normalizer-base
    environment:
      <<: *normalizer-base-env
      SYMBOL: SOLUSDT
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=normalizer,project=market-data,symbol=solusdt"

  normalizer-xrpusdt:
    <<: *normalizer-base
    environment:
      <<: *normalizer-base-env
      SYMBOL: XRPUSDT
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=normalizer,project=market-data,symbol=xrpusdt"

  normalizer-bnbusdt:
    <<: *normalizer-base
    environment:
      <<: *normalizer-base-env
      SYMBOL: BNBUSDT
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=normalizer,project=market-data,symbol=bnbusdt"

  normalizer-dogeusdt:
    <<: *normalizer-base
    environment:
      <<: *normalizer-base-env
      SYMBOL: DOGEUSDT
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=normalizer,project=market-data,symbol=dogeusdt"

  normalizer-btcfdusd:
    <<: *normalizer-base
    environment:
      <<: *normalizer-base-env
      SYMBOL: BTCFDUSD
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=normalizer,project=market-data,symbol=btcfdusd"

  normalizer-ethfdusd:
    <<: *normalizer-base
    environment:
      <<: *normalizer-base-env
      SYMBOL: ETHFDUSD
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=normalizer,project=market-data,symbol=ethfdusd"

  api:
    build:
      context: .
      dockerfile: ./src/api/Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      EXCHANGE: ${EXCHANGE:-binance}
      SEGMENT: ${SEGMENT:-spot}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-market_data}
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - market-data-net
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=api,project=market-data"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki
    networks:
      - market-data-net
    # Loki's own container logs stay on the default json-file driver: sending them
    # through the loki driver would create a bootstrap loop (Loki needs to be up to
    # receive its own first log lines).

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - market-data-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cadvisor.rule=Host(`cadvisor.localhost`)"
      - "traefik.http.services.cadvisor.loadbalancer.server.port=8080"

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - cadvisor
    networks:
      - market-data-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  grafana:
    image: grafana/grafana:13.0.8
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/market-data-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - market-data-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v3.7.12
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=market-data-net
      - --entrypoints.web.address=:80
      - --api.dashboard=true
    ports:
      - "${TRAEFIK_HOST_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - market-data-net
    logging:
      driver: loki
      options:
        <<: *loki-log-options
        loki-external-labels: "service=traefik,project=market-data"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
